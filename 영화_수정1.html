<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나의 영화 티어리스트</title>
<style>
:root{
  --bg:#f6f5f2;--surface:#ffffff;--text:#1c1b19;--muted:#6b6862;--line:#e3e0d9;
  --s:#e5484d;--a:#f08a24;--b:#e5b800;--c:#3e9b6b;--accent:#2f6fed;--err:#c62828;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#141413;--surface:#1f1e1c;--text:#f1efea;--muted:#a09c94;--line:#33312e;
    --s:#ff6b6f;--a:#ffa04a;--b:#f2c92e;--c:#58c58f;--accent:#6c9bff;--err:#ff8a80;color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.4}
main{max-width:1000px;margin:0 auto;padding:28px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px}
h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 4px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0;font-size:.95rem}
.actions{display:flex;gap:8px}
button,input,select{font:inherit;font-size:.9rem}
button{padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--text);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.primary:hover{color:#fff;opacity:.9}
.panel{display:none;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.panel.open{display:block}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted)}
.field input,.field select{padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
.field.grow{flex:1 1 200px}
.field.year input{width:110px}
.msg{min-height:1.2em;margin:8px 0 0;font-size:.85rem;color:var(--err)}
.tier{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:12px;transition:border-color .15s}
.tier.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.label{flex:0 0 64px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:800;color:#fff;background:var(--tc)}
.cards{flex:1;min-height:150px;display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;padding:12px;align-content:start}
.cards:empty::before{content:"여기로 영화를 끌어다 놓으세요";grid-column:1/-1;color:var(--muted);font-size:.85rem;align-self:center;text-align:center;padding:40px 0}
.card{margin:0;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.card.drag{opacity:.35}
.poster{aspect-ratio:2/3;border-radius:8px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;
  color:#fff;background:linear-gradient(160deg,hsl(var(--h) 55% 38%),hsl(calc(var(--h) + 40) 60% 20%));
  border-bottom:4px solid var(--tc);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.poster small{opacity:.8;font-size:.7rem}
.poster b{font-size:.9rem;line-height:1.25;word-break:keep-all}
.title{margin-top:6px;font-size:.82rem;font-weight:600;text-align:center;word-break:keep-all}
.ghost{position:fixed;z-index:1000;pointer-events:none;opacity:.92;transform:rotate(3deg);
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.4))}
@media (max-width:520px){
  .label{flex-basis:44px;font-size:1.5rem}
  .cards{grid-template-columns:repeat(3,1fr);gap:8px;padding:10px}
}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>나의 영화 티어리스트</h1>
      <p class="sub">1990년 이후 영화 <span id="count">0</span>편 · 카드를 끌어서 티어를 바꿀 수 있어요. 변경 내용은 자동으로 저장돼요.</p>
    </div>
    <div class="actions">
      <button id="toggleAdd" type="button" class="primary">+ 영화 추가</button>
      <button id="reset" type="button">처음 상태로 되돌리기</button>
    </div>
  </header>

  <section id="addPanel" class="panel" aria-label="영화 추가">
    <div class="row">
      <label class="field grow">영화 제목
        <input id="newTitle" type="text" maxlength="30" placeholder="예: 부산행" autocomplete="off">
      </label>
      <label class="field year">개봉 연도
        <input id="newYear" type="number" inputmode="numeric" placeholder="예: 2016">
      </label>
      <label class="field">티어
        <select id="newTier">
          <option value="S">S</option><option value="A">A</option>
          <option value="B">B</option><option value="C">C</option>
        </select>
      </label>
      <button id="addBtn" type="button" class="primary">추가하기</button>
    </div>
    <p id="addMsg" class="msg" role="alert"></p>
  </section>

  <div id="list"></div>
</main>
<script>
const TIERS = [
  {t:"S", c:"var(--s)"}, {t:"A", c:"var(--a)"}, {t:"B", c:"var(--b)"}, {t:"C", c:"var(--c)"}
];
const KEY = "movieTierlist.v2";

function defaultState(){
  return {
    movies:{
      m1:["기생충",2019], m2:["인터스텔라",2014],
      m3:["올드보이",2003], m4:["인셉션",2010],
      m5:["라라랜드",2016], m6:["어바웃 타임",2013],
      m7:["아바타",2009], m8:["트랜스포머",2007]
    },
    tiers:{S:["m1","m2"], A:["m3","m4"], B:["m5","m6"], C:["m7","m8"]},
    next:9
  };
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.movies && s.tiers && Number.isInteger(s.next) && TIERS.every(x => Array.isArray(s.tiers[x.t]))){
        const ids = TIERS.flatMap(x => s.tiers[x.t]);
        if(new Set(ids).size === ids.length && ids.every(id => Array.isArray(s.movies[id]))) return s;
      }
    }
  }catch(e){}
  return defaultState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }

let state = load();
const root = document.getElementById("list");

function hueOf(id){
  let h = 0;
  for(const ch of id) h = (h * 31 + ch.charCodeAt(0)) % 360;
  return (h * 7 + 210) % 360;
}

function makeCard(id, tierColor){
  const [name, yr] = state.movies[id];
  const fig = document.createElement("figure");
  fig.className = "card"; fig.dataset.id = id;
  fig.style.setProperty("--tc", tierColor);
  const poster = document.createElement("div");
  poster.className = "poster"; poster.style.setProperty("--h", hueOf(id));
  const small = document.createElement("small"); small.textContent = yr;
  const b = document.createElement("b"); b.textContent = name;
  poster.append(small, b);
  const cap = document.createElement("figcaption");
  cap.className = "title"; cap.textContent = name;
  fig.append(poster, cap);
  fig.addEventListener("pointerdown", onDown);
  return fig;
}

function render(){
  root.textContent = "";
  TIERS.forEach(({t,c}) => {
    const row = document.createElement("section");
    row.className = "tier"; row.dataset.tier = t; row.style.setProperty("--tc", c);
    const label = document.createElement("div"); label.className = "label"; label.textContent = t;
    const cards = document.createElement("div"); cards.className = "cards";
    state.tiers[t].forEach(id => cards.appendChild(makeCard(id, c)));
    row.append(label, cards);
    root.appendChild(row);
  });
  document.getElementById("count").textContent = TIERS.reduce((n, x) => n + state.tiers[x.t].length, 0);
}

/* ---- 영화 추가 ---- */
const panel = document.getElementById("addPanel");
const titleEl = document.getElementById("newTitle");
const yearEl = document.getElementById("newYear");
const tierEl = document.getElementById("newTier");
const msgEl = document.getElementById("addMsg");

document.getElementById("toggleAdd").addEventListener("click", () => {
  panel.classList.toggle("open");
  if(panel.classList.contains("open")) titleEl.focus();
});

function addMovie(){
  const title = titleEl.value.trim();
  const year = parseInt(yearEl.value, 10);
  const maxYear = new Date().getFullYear() + 1;
  if(!title){ msgEl.textContent = "영화 제목을 입력해 주세요."; titleEl.focus(); return; }
  if(!Number.isInteger(year) || year < 1990 || year > maxYear){
    msgEl.textContent = "개봉 연도는 1990년부터 " + maxYear + "년 사이의 숫자로 입력해 주세요.";
    yearEl.focus(); return;
  }
  const id = "m" + state.next++;
  state.movies[id] = [title, year];
  state.tiers[tierEl.value].push(id);
  save(); render();
  titleEl.value = ""; yearEl.value = "";
  msgEl.textContent = "";
  titleEl.focus();
}
document.getElementById("addBtn").addEventListener("click", addMovie);
[titleEl, yearEl].forEach(el => el.addEventListener("keydown", e => { if(e.key === "Enter") addMovie(); }));

/* ---- 드래그 앤 드롭 (마우스·터치 공통) ---- */
let drag = null;
function onDown(e){
  if(e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  const card = e.currentTarget;
  const rect = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.add("ghost");
  ghost.style.width = rect.width + "px";
  document.body.appendChild(ghost);
  card.classList.add("drag");
  drag = {card, ghost, dx: e.clientX - rect.left, dy: e.clientY - rect.top};
  moveGhost(e);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
}
function moveGhost(e){
  drag.ghost.style.left = (e.clientX - drag.dx) + "px";
  drag.ghost.style.top = (e.clientY - drag.dy) + "px";
}
function onMove(e){
  if(!drag) return;
  moveGhost(e);
  document.querySelectorAll(".tier.over").forEach(el => el.classList.remove("over"));
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const tier = el && el.closest(".tier");
  if(!tier) return;
  tier.classList.add("over");
  const cards = tier.querySelector(".cards");
  let before = null;
  for(const c of cards.querySelectorAll(".card")){
    if(c === drag.card) continue;
    const r = c.getBoundingClientRect();
    if(e.clientY < r.top || (e.clientY <= r.bottom && e.clientX < r.left + r.width/2)){ before = c; break; }
  }
  if(before){ if(drag.card.nextSibling !== before) cards.insertBefore(drag.card, before); }
  else if(cards.lastElementChild !== drag.card) cards.appendChild(drag.card);
  drag.card.style.setProperty("--tc", getComputedStyle(tier).getPropertyValue("--tc"));
}
function onUp(){
  if(!drag) return;
  window.removeEventListener("pointermove", onMove);
  window.removeEventListener("pointerup", onUp);
  window.removeEventListener("pointercancel", onUp);
  drag.ghost.remove();
  drag.card.classList.remove("drag");
  document.querySelectorAll(".tier.over").forEach(el => el.classList.remove("over"));
  drag = null;
  document.querySelectorAll(".tier").forEach(tier => {
    state.tiers[tier.dataset.tier] = [...tier.querySelectorAll(".card")].map(c => c.dataset.id);
  });
  save();
  render();
}

document.getElementById("reset").addEventListener("click", () => {
  if(confirm("추가한 영화를 모두 지우고 처음 8편의 배치로 되돌릴까요?")){
    state = defaultState();
    save(); render();
  }
});

render();
</script>
</body>
</html>
